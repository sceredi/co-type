syntax = "proto3";

package game;

option go_package = "github.com/sceredi/co-type/common/proto/game";

// The game service definition.
service GameService {
  // Bidirectional streaming RPC for managing game lobbies and matches.
  rpc Manage(stream ServerEnvelope) returns (stream ClientEnvelope);
}

// Envelopes for communication between clients and the game server.
message ServerEnvelope {
  oneof payload {
    CreateLobby create = 1;
    JoinLobby join = 2;
  }
}

// Envelopes for communication from the game server to clients.
message ClientEnvelope {
  oneof payload {
    CreateLobbyAck create_ack = 1;
    JoinLobbyAck join_ack = 2;
  }
}

// Messages for lobby management.
message CreateLobby {
  string lobby_id = 1;
  string player_name = 2;
}

// Acknowledgment for lobby creation.
message CreateLobbyAck {
  bool success = 1;
  string message = 2;
}

// Messages for joining a lobby.
message JoinLobby {
  string lobby_id = 1;
  string player_name = 2;
}

// Acknowledgment for joining a lobby.
message JoinLobbyAck {}
