syntax = "proto3";

package lobby;

option go_package = "github.com/sceredi/co-type/common/proto/lobby";

// The game service definition.
service LobbyService {
  rpc CreateLobby(CreateLobbyRequest) returns (CreateLobbyResponse);
  rpc JoinLobby(JoinLobbyRequest) returns (JoinLobbyResponse);
  rpc LeaveLobby(LeaveLobbyRequest) returns (LeaveLobbyResponse);
  rpc EditPlayer(EditPlayerRequest) returns (EditPlayerResponse);
  rpc ReadyPlayer(ReadyPlayerRequest) returns (ReadyPlayerResponse);
  rpc Subscribe(SubscribeRequest) returns (stream LobbyEvent);
  rpc SendKeyPress(SendKeyPressRequest) returns (SendKeyPressResponse);
  // RPC to resume a crashed game on a new server. The first caller creates the lobby;
  // subsequent callers (reconnecting players) provide their game state so the server
  // can keep the state with the highest revision.
  rpc ResumeGame(ResumeGameRequest) returns (ResumeGameResponse);
}

enum LobbyStatus {
  WAITING_FOR_PLAYERS = 0;
  PLAYING = 1;
  PAUSED = 2;
  GAME_ENDED = 3;
}

message GameInfo {
  string snippet = 1;
  int64 correct_chars = 2;
  int64 wrong_chars = 3;
  int64 revision = 4;
  // start_time_ms is the Unix timestamp in milliseconds when the game started.
  int64 start_time_ms = 5;
  // elapsed_ms is the total game duration in milliseconds, set when the game ends.
  int64 elapsed_ms = 6;
}

message Lobby {
  string id = 1;
  repeated Player players = 2;
  GameInfo game = 3;
  LobbyStatus status = 4;
}

message Player {
  string name = 1;
  bool is_ready = 2;
  string allowed_characters = 3;
  string blocked_characters = 4;
  bool can_delete = 5;
}

// Messages for lobby management.
message CreateLobbyRequest {
  string lobby_id = 1;
  string player_name = 2;
}

message CreateLobbyResponse {
  Lobby lobby = 1;
}

message JoinLobbyRequest {
  string lobby_id = 1;
  string player_name = 2;
}

message JoinLobbyResponse {
  Lobby lobby = 1;
}

message LeaveLobbyRequest {
  string lobby_id = 1;
  string player_name = 2;
}

message LeaveLobbyResponse {
  bool success = 1;
  string message = 2;
}

message EditPlayerRequest {
  string lobby_id = 1;
  string player_name = 2;
  bool is_ready = 3;
  string allowed_characters = 4;
  string blocked_characters = 5;
  bool can_delete = 6;
}

message EditPlayerResponse {
  Lobby lobby = 1;
}

message ReadyPlayerRequest {
  string lobby_id = 1;
  string player_name = 2;
}

message ReadyPlayerResponse {
  Lobby lobby = 1;
}

message SubscribeRequest {
  string lobby_id = 1;
  string player_name = 2;
}

message LobbyEvent {
  Lobby lobby = 1;
}

message SendKeyPressRequest {
  string lobby_id = 1;
  string player_name = 2;
  string key = 3;
  bool is_backspace = 4;
}

message SendKeyPressResponse {
  Lobby lobby = 1;
}

// Request to resume a crashed game on a new server.
message ResumeGameRequest {
  Lobby lobby = 1;
  string player_name = 2;
}

// Response after resuming a game.
message ResumeGameResponse {
  Lobby lobby = 1;
}
