syntax = "proto3";

package control;

option go_package = "github.com/sceredi/co-type/common/proto/control";

// The control service definition.
service ControlService {
  rpc RegisterServer(RegisterServerRequest) returns (RegisterServerResponse);
  rpc RegisterLobby(RegisterLobbyRequest) returns (RegisterLobbyResponse);
  rpc UnregisterLobby(UnregisterLobbyRequest) returns (UnregisterLobbyResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// Messages for server registration.
message RegisterServerRequest {
  string name = 1;
  string host = 2;
  int64 port = 3;
}

// Acknowledgment for server registration.
message RegisterServerResponse {
  bool success = 1;
  string message = 2;
}

// Messages for lobby registration with the broker.
message RegisterLobbyRequest {
  string lobby_id = 1;
  string server_name = 2;
}

// Response for lobby registration.
message RegisterLobbyResponse {
  bool success = 1;
  string message = 2;
}

// Request to unregister a lobby from the broker.
message UnregisterLobbyRequest {
  string lobby_id = 1;
}

// Response for lobby unregistration.
message UnregisterLobbyResponse {
  bool success = 1;
  string message = 2;
}

// Heartbeat request sent periodically by a server to signal it is alive and report its current load.
message HeartbeatRequest {
  string name = 1;
  int64 load = 2;
}

// Acknowledgment for a heartbeat.
message HeartbeatResponse {
  bool success = 1;
}
