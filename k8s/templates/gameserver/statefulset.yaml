apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gameserver
  namespace: cotype
spec:
  replicas: 3
  serviceName: gameserver
  selector:
    matchLabels:
      app: gameserver
  template:
    metadata:
      labels:
        app: gameserver
    spec:
      containers:
        - name: gameserver
          image: co-type/server:latest
          imagePullPolicy: Never
          ports:
            - name: game
              containerPort: {{ .Values.matchPort }}
          env:
            - name: GAME_PORT
              value: "{{ .Values.matchPort }}"
            - name: CONTROL_ADDR
              value: "broker.cotype.svc.cluster.local"
            - name: CONTROL_PORT
              value: "{{ .Values.controlPort }}"

            - name: SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVER_ADDR
              value: "{{ .Values.global.nodeIp }}" # Where the server can be contacted by clients
            - name: SERVER_PORT
              value: "30100"
